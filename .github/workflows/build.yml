name: Build ZArchive

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "install-dir=${{ github.workspace }}/install_dir" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=/usr/local/share/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DBUILD_STATIC_TOOL=ON
          -S ${{ github.workspace }}

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DBUILD_STATIC_TOOL=ON
          -S ${{ github.workspace }}
          
      - name: Configure CMake (macOS)
        if: matrix.os == 'macos-latest'
        run: | 
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_STATIC_TOOL=OFF \
          -S ${{ github.workspace }}
        
      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Install (Collect clean binaries and headers)
        # Вызывает правила install() из вашего CMakeLists.txt и складывает результат в чистую папку
        run: cmake --install ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --prefix ${{ steps.strings.outputs.install-dir }}

      - name: Package for Release
        shell: bash
        run: |
          cd "${{ steps.strings.outputs.install-dir }}"
          7z a "${{ github.workspace }}/zarchive-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}.zip" *
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zarchive-build-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}
          path: ${{ steps.strings.outputs.install-dir }}

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/zarchive-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}.zip
          generate_release_notes: true
